<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BMI 계산기</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 8px 16px; }
        .result { margin-top: 20px; padding: 12px; background: #f0f0f0; border-radius: 6px; }
        .error { margin-top: 20px; color: red; }
    </style>
</head>
<body>
    <h1>BMI 계산기</h1>
    <form method="post">
        <label for="height">키 (cm)</label>
        <input type="number" step="0.1" id="height" name="height" required>

        <label for="weight">몸무게 (kg)</label>
        <input type="number" step="0.1" id="weight" name="weight" required>

        <button type="submit">계산하기</button>
    </form>

    {% if result %}
    <div class="result">
        <p>BMI: <strong>{{ result.bmi }}</strong></p>
        <p>분류: <strong>{{ result.category }}</strong></p>
    </div>
    {% endif %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</body>
</html>
